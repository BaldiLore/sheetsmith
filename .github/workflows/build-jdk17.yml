# The workflow name is the label shown on the README badge.
name: JDK 17

on:
  # Continuous verification on the integration branch and, after each merge,
  # on master: the commit verified here is the one that will be tagged.
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# Scoped to this workflow: a newer push supersedes only its own previous run,
# never the builds of the other JDKs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-reusable.yml
    with:
      java-version: '17'
